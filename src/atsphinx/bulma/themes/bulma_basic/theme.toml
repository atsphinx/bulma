[theme]
inherit = "basic"
stylesheets = ["style.css"]
pygments_style = { default = "sphinx" }
sidebars = [
    "sidebar/logo.html",
    "sidebar/searchbox.html",
    "sidebar/localtoc.html",
    "sidebar/relations.html",
    "sidebar/sourcelink.html",
]

[options]
bulma_version = "1.0.4"
color_mode = ""
show_theme_credit = true

# DEPRECATED
bulmaswatch_version = "0.8.1"
logo_class = "is-128x128"
logo_description = ""
navbar_links = []
navbar_search = false
navbar_icons = []
navbar_show_hidden_toctree = false

[options.bulmaswatch]
theme = false
version = "0.8.1"

[options.logo]
classes = "is-128x128"
description = ""

[options.navbar]
links = []
search = false
icons = []
show_hidden_toctree = false

[options.layout]
"**" = [
    {type = "sidebar", size = 2},
    {type = "main", size = 10},
]
